name: mpls-lab

topology:
  defaults:
    env:
      CLAB_MGMT_VRF: "true"
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      binds:
        - ./start.sh:/start.sh
      cmd: sh /start.sh

    r2:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      binds:
        - ./start.sh:/start.sh   
      cmd: sh /start.sh

    r3:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      binds:
        - ./start.sh:/start.sh
      cmd: sh /start.sh

    r4:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      binds:
        - ./start.sh:/start.sh   
      cmd: sh /start.sh

    r5:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      binds:
        - ./start.sh:/start.sh
      cmd: sh /start.sh

    r6:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      binds:
        - ./start.sh:/start.sh   
      cmd: sh /start.sh

    c1:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      binds:
        - ./start.sh:/start.sh
      cmd: sh /start.sh

    c2:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      binds:
        - ./start.sh:/start.sh   
      cmd: sh /start.sh

  links:
    - endpoints: ["r1:eth3", "r2:eth3"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r1:eth4", "r4:eth1"]
    - endpoints: ["r3:eth3", "r2:eth2"]
    - endpoints: ["r3:eth2", "r4:eth2"]
    - endpoints: ["r4:eth3", "r2:eth4"]
    - endpoints: ["r5:eth2", "r1:eth1"]
    - endpoints: ["r2:eth1", "r6:eth2"]
    - endpoints: ["c1:eth1", "r5:eth1"]
    - endpoints: ["r6:eth1", "c2:eth1"]


