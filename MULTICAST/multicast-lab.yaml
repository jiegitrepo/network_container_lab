name: multicast-lab

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
        - ./start.sh:/start.sh
      cmd: sh /start.sh

    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
        - ./start.sh:/start.sh   
      cmd: sh /start.sh

    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
        - ./start.sh:/start.sh
      cmd: sh /start.sh

    r4:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
        - ./start.sh:/start.sh   
      cmd: sh /start.sh

    c1:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
        - ./start.sh:/start.sh
      cmd: sh /start.sh

    c2:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
        - ./start.sh:/start.sh   
      cmd: sh /start.sh

    s1:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
        - ./start.sh:/start.sh
      cmd: sh /start.sh

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "c1:eth1"]
    - endpoints: ["r3:eth2", "c2:eth1"]
    - endpoints: ["r3:eth3", "r4:eth1"]
    - endpoints: ["r4:eth2", "s1:eth1"]



