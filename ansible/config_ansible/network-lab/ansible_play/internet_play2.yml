---
- name: Configure Router
  hosts: r1
  become: yes # vtysh often requires root privileges

  tasks:
    - name: Configure interface and OSPF
      ansible.builtin.shell: | # Use multiline string for readability
        vtysh << EOF
        configure terminal
        log file /var/log/frr/bgp.log
        no ipv6 forwarding
        !
        interface eth2
        description R2-3697
        ip address 202.72.49.140/31
        ip ospf area 0
        ip ospf cost 5
        ip ospf network point-to-point
        ipv6 address 2403:400:100:3697::140/64
        exit
        !
        interface eth3
        description R3-3200
        ip address 202.72.49.21/31
        ip ospf area 0
        ip ospf cost 700
        ip ospf network point-to-point
        ipv6 address 2403:400:100:3200::21/64
        exit
        !
        interface eth4
        description R5-3699
        ip address 202.72.49.144/31
        ip ospf area 0
        ip ospf cost 700
        ip ospf network point-to-point
        ipv6 address 2403:400:100:3699::144/64
        exit
        !
        interface eth5
        description SW1-3693
        ip address 202.72.49.114/31
        ipv6 address 2403:400:100:3693::114/64
        exit
        !
        interface lo1
        ip address 202.72.48.240/32
        ipv6 address 2403:400:100::240/128
        exit
        !
        router ospf vrf private
        ospf router-id 202.72.48.240
        log-adjacency-changes detail
        default-information originate always metric 1 metric-type 1
        exit
        !
        end
        clear ip ospf process
        write
        exit
        EOF
      args:
        chdir: / # It's good practice to set chdir for shell commands
      register: vtysh_output
      changed_when: "'Configuration saved' in vtysh_output.stdout or 'Building configuration...' in vtysh_output.stdout"
      # You might need to adjust 'changed_when' based on the exact output of your vtysh implementation
      # Alternatively, you could check for specific error messages in 'vtysh_output.stderr' for failed_when

    - name: Display vtysh output
      debug:
        var: vtysh_output.stdout


