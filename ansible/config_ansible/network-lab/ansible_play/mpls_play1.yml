---
- name: Add lo1 to all routers
  hosts: linux_nodes
  gather_facts: no

  tasks:
      - name: Create multiple dummy interfaces (lo1 to lo3)
        ansible.builtin.command: "ip link add lo{{ item }} type dummy"
        args:
          creates: "/sys/class/net/lo{{ item }}" # Idempotent check: only create if /sys/class/net/loX doesn't exist
        loop: "{{ range(1, 4) | list }}" # Generates 1, 2, 3

      - name: Get IP address information
        ansible.builtin.shell: ip ad | grep -E -A1 "lo"
        register: ip_output
      
      - name: Print IP address output
        debug:
          var: ip_output.stdout

- name: Create vrf red
  hosts: 
    - r5
    - r6
  gather_facts: no

  tasks:
      - name: add red
        ansible.builtin.command: ip link add red type vrf table 100
        args:
          creates: "/sys/class/net/red" # Idempotent check: only create if /sys/class/net/loX doesn't exist

      - name: vrf red up
        ansible.builtin.command: ip link set red up

      - name: add eth1 to red
        ansible.builtin.command: ip link set dev eth1 master red

- name: Create vrf blue
  hosts: 
    - r5
    - r6
  gather_facts: no

  tasks:
      - name: add blue
        ansible.builtin.command: ip link add blue type vrf table 200
        args:
          creates: "/sys/class/net/blue" # Idempotent check: only create if /sys/class/net/loX doesn't exist

      - name: vrf blue up
        ansible.builtin.command: ip link set blue up

      - name: add eth3 to blue
        ansible.builtin.command: ip link set dev eth3 master blue


- name: Add mpls sysctl interface
  hosts: r5
  gather_facts: no

  tasks:
      - name: Get IP address information
        ansible.builtin.shell: |
          sysctl -w net.mpls.conf.lo1.input=1
          sysctl -w net.mpls.conf.eth2.input=1
          sysctl -w net.mpls.platform_labels=1048575


