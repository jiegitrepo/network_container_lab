---
- name: Configure Router
  hosts: r1
  become: yes # vtysh often requires root privileges

  tasks:
    - name: Configure interface and OSPF and MPLS
      ansible.builtin.shell: | # Use multiline string for readability
        vtysh << EOF
        configure terminal
        !
        interface eth1
        ip address 10.0.15.1/24
        ip ospf network point-to-point
        mpls enable
        exit
        !
        interface eth3
        ip address 10.0.12.1/24
        ip ospf network point-to-point
        mpls enable
        exit
        !
        interface lo
        mpls enable
        exit
        !
        interface lo1
        ip address 1.1.1.1/32
        exit
        !
        router ospf
        ospf router-id 1.1.1.1
        network 1.1.1.1/32 area 0
        network 10.0.12.0/24 area 0
        network 10.0.15.0/24 area 0
        exit
        !
        mpls ldp
        router-id 1.1.1.1
        !
        address-family ipv4
        discovery transport-address 1.1.1.1
        !
        interface eth1
        exit
        !
        interface eth3
        exit
        !
        exit-address-family
        !
        exit
        !
        end
        clear ip ospf process
        write
        exit
        EOF
      args:
        chdir: / # It's good practice to set chdir for shell commands
      # You might need to adjust 'changed_when' based on the exact output of your vtysh implementation
      # Alternatively, you could check for specific error messages in 'vtysh_output.stderr' for failed_when
      loop: [1, 2]


