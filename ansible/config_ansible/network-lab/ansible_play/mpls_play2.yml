- name: Configure Router
  hosts: r5
  become: yes # vtysh often requires root privileges

  tasks:
    - name: Configure interface and OSPF
      ansible.builtin.shell: | # Use multiline string for readability
        vtysh << EOF
        configure terminal
        interface eth1
        ip address 20.0.15.5/24
        ip ospf passive
        mpls enable
        exit
        !
        interface eth2
        ip address 10.0.15.5/24
        ip ospf network point-to-point
        mpls enable
        exit
        !
        interface lo
        mpls enable
        exit
        !
        interface lo1
        ip address 5.5.5.5/32
        exit
        !
        router bgp 65100
        bgp router-id 5.5.5.5
        no bgp ebgp-requires-policy
        neighbor 6.6.6.6 remote-as internal
        neighbor 6.6.6.6 update-source 5.5.5.5
        neighbor 20.0.15.1 remote-as external
        !
        address-family ipv4 unicast
        neighbor 6.6.6.6 next-hop-self
        exit-address-family
        exit
        !
        router ospf
        ospf router-id 5.5.5.5
        network 5.5.5.5/32 area 0
        network 10.0.15.0/24 area 0
        exit
        !
        mpls ldp
        router-id 5.5.5.5
        !
        address-family ipv4
        discovery transport-address 5.5.5.5
        !
        interface eth2
        exit
        !
        exit-address-family
        !
        exit
        !
        end
        clear ip ospf process
        write
        exit
        EOF
      args:
        chdir: / # It's good practice to set chdir for shell commands
      # You might need to adjust 'changed_when' based on the exact output of your vtysh implementation
      # Alternatively, you could check for specific error messages in 'vtysh_output.stderr' for failed_when
