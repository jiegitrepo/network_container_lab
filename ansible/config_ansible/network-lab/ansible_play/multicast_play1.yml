- name: Add Troubleshooting tools
  hosts: linux_nodes
  gather_facts: no
  become: yes
  tags: iperf
  
  tasks:
      - name: Install iperf and tcp dump
        ansible.builtin.shell: |
          apk update && apk add iperf tcpdump


- name: Add ip rule
  hosts: r4
  gather_facts: no
  become: yes
  tags: rule
  
  tasks:
      - name: Add IP rule in fhr
        ansible.builtin.shell: |
          ip rule add to 1.1.1.1 lookup 100 pref 100