- name: Configure Router
  hosts: s1
  become: yes # vtysh often requires root privileges

  tasks:
    - name: Configure interface and OSPF
      ansible.builtin.shell: | # Use multiline string for readability
        vtysh << EOF
        configure terminal
        ip route 0.0.0.0/0 20.0.41.4
        ip route 224.0.0.0/4 20.0.41.4
        !
        interface eth1
        ip address 20.0.41.1/24
        exit
        !
        end
        write
        exit
        EOF
