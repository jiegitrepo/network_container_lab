- name: Configure Router
  hosts: r5
  become: yes # vtysh often requires root privileges

  tasks:
    - name: Configure interface and OSPF
      ansible.builtin.shell: | # Use multiline string for readability
        vtysh << EOF
        configure terminal
        interface eth1
        ip address 10.0.45.5/24
        ip ospf network point-to-point
        exit
        !
        interface eth2
        ip address 10.0.56.5/24
        exit
        !
        interface lo1
        ip address 5.5.5.5/32
        exit
        !
        router ospf vrf private
        ospf router-id 5.5.5.5
        network 10.0.45.0/24 area 45
        redistribute connected route-map OSPF
        area 45 nssa
        exit
        !
        ip prefix-list OSPF seq 5 permit 10.0.56.0/24
        ip prefix-list OSPF seq 99999 deny any
        !
        route-map OSPF permit 10
        match ip address prefix-list OSPF
        exit
        !
        route-map OSPF deny 9999
        exit
        !
        end
        clear ip ospf process
        write
        exit
        EOF
      args:
        chdir: / # It's good practice to set chdir for shell commands
      register: vtysh_output
      changed_when: "'Configuration saved' in vtysh_output.stdout or 'Building configuration...' in vtysh_output.stdout"
      # You might need to adjust 'changed_when' based on the exact output of your vtysh implementation
      # Alternatively, you could check for specific error messages in 'vtysh_output.stderr' for failed_when

    - name: Display vtysh output
      debug:
        var: vtysh_output.stdout

- name: Configure Router
  hosts: r6
  become: yes # vtysh often requires root privileges

  tasks:
    - name: Configure interface and OSPF
      ansible.builtin.shell: | # Use multiline string for readability
        vtysh << EOF
        configure terminal
        vrf private
        ip route 0.0.0.0/0 10.0.56.5
        exit-vrf
        !
        interface eth1
        ip address 10.0.56.6/24
        exit
        !
        interface lo1
        ip address 6.6.6.6/32
        exit
        !
        end
        write
        exit
