---
- name: Add lo1 to all routers
  hosts: linux_nodes
  gather_facts: no

  tasks:
      - name: Create multiple dummy interfaces (lo1 to lo3)
        ansible.builtin.command: "ip link add lo{{ item }} type dummy"
        args:
          creates: "/sys/class/net/lo{{ item }}" # Idempotent check: only create if /sys/class/net/loX doesn't exist
        loop: "{{ range(1, 4) | list }}" # Generates 1, 2, 3

      - name: Get IP address information
        ansible.builtin.shell: ip ad | grep -E -A1 "lo"
        register: ip_output
      
      - name: Print IP address output
        debug:
          var: ip_output.stdout

- name: Add vrf
  hosts: linux_nodes
  gather_facts: no

  tasks:
      - name: add vrf
        ansible.builtin.command: ip link add test type vrf table 100
        args:
          creates: "/sys/class/net/test" # Idempotent check: only create if /sys/class/net/loX doesn't exist

- name: UP vrf
  hosts: linux_nodes
  gather_facts: no

  tasks:
      - name: vrf up
        ansible.builtin.command: ip link set test up


